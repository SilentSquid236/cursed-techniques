name: Release

# Push a tag like v0.2.0 to build the jar, attach it to a GitHub release,
# and (once configured) upload it to CurseForge.
#
# CurseForge setup (one time):
#   Settings > Secrets and variables > Actions
#     Secret   CURSEFORGE_TOKEN       - API token from curseforge.com account settings
#     Variable CURSEFORGE_PROJECT_ID  - numeric ID of the "Cursed Techniques" project
# Without them the CurseForge step is skipped.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      CF_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3

      - name: Work out version
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF#refs/tags/v}"; else v="0.0.0-dev.${GITHUB_RUN_NUMBER}"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Build
        run: gradle build -Pmod_version=${{ steps.ver.outputs.version }} --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: cursedtech-${{ steps.ver.outputs.version }}
          path: build/libs/*.jar

      - name: GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/cursedtech-${{ steps.ver.outputs.version }}.jar
          generate_release_notes: true

      - name: Upload to CurseForge
        if: startsWith(github.ref, 'refs/tags/v') && env.CF_TOKEN != '' && vars.CURSEFORGE_PROJECT_ID != ''
        uses: itsmeow/curseforge-upload@v3
        with:
          token: ${{ secrets.CURSEFORGE_TOKEN }}
          project_id: ${{ vars.CURSEFORGE_PROJECT_ID }}
          game_endpoint: minecraft
          file_path: build/libs/cursedtech-${{ steps.ver.outputs.version }}.jar
          display_name: Cursed Techniques ${{ steps.ver.outputs.version }}
          game_versions: "Minecraft 1.21:1.21.1,NeoForge,Java 21"
          release_type: release
          changelog: "See https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}"
