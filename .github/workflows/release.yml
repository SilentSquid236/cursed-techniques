name: Release

# Every push to main builds the jar. When mod_version in gradle.properties is
# new (no v<version> tag yet), it also creates the GitHub release + tag and,
# once configured, uploads to CurseForge. To publish: bump mod_version, push.
#
# CurseForge setup (one time):
#   Settings > Secrets and variables > Actions
#     Secret   CURSEFORGE_TOKEN       - API token from curseforge.com account settings
#     Variable CURSEFORGE_PROJECT_ID  - numeric ID of the "Cursed Techniques" project
# Without them the CurseForge step is skipped.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      CF_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3

      - name: Work out version
        id: ver
        run: |
          v=$(grep '^mod_version=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$v" >/dev/null; then echo "new=false" >> "$GITHUB_OUTPUT"; else echo "new=true" >> "$GITHUB_OUTPUT"; fi

      - name: Build
        run: gradle build -Pmod_version=${{ steps.ver.outputs.version }} --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: cursedtech-${{ steps.ver.outputs.version }}
          path: build/libs/*.jar

      - name: GitHub release
        if: steps.ver.outputs.new == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: Cursed Techniques ${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: build/libs/cursedtech-${{ steps.ver.outputs.version }}.jar
          generate_release_notes: true

      - name: Upload to CurseForge
        if: steps.ver.outputs.new == 'true' && env.CF_TOKEN != '' && vars.CURSEFORGE_PROJECT_ID != ''
        uses: itsmeow/curseforge-upload@v3
        with:
          token: ${{ secrets.CURSEFORGE_TOKEN }}
          project_id: ${{ vars.CURSEFORGE_PROJECT_ID }}
          game_endpoint: minecraft
          file_path: build/libs/cursedtech-${{ steps.ver.outputs.version }}.jar
          display_name: Cursed Techniques ${{ steps.ver.outputs.version }}
          game_versions: "Minecraft 1.21:1.21.1,NeoForge,Java 21"
          release_type: release
          changelog: "See https://github.com/${{ github.repository }}/releases/tag/v${{ steps.ver.outputs.version }}"
